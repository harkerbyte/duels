name: Idea or new game
description: Suggest a feature or a game
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: db
    attributes:
      label: How would it work through the database?
      description: Everything between players travels as shadeDB reads and writes. No websockets or push.
